<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MiniBlock 3D Walker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="game"></canvas>

      <div class="hud">
        <div>
          <strong>MiniBlock 3D</strong>
          <span>Voxel-Walker Demo</span>
        </div>
        <button id="resetBtn" type="button">Neu starten</button>
      </div>

      <div class="help">
        <b>Steuerung:</b> WASD / Pfeile · Leertaste springen · Touch-Buttons am Handy
      </div>

      <div class="mobile-controls" aria-label="Mobile Steuerung">
        <div class="dpad">
          <button data-key="forward">▲</button>
          <div>
            <button data-key="left">◀</button>
            <button data-key="back">▼</button>
            <button data-key="right">▶</button>
          </div>
        </div>
        <button class="jump" data-key="jump">Springen</button>
      </div>

      <div id="loading">Lade 3D-Welt…</div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
